version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: omnimind-chromadb
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=true

  backend:
    image: ${ECR_REGISTRY}/omnimind-backend:${IMAGE_TAG:-latest}
    container_name: omnimind-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONPATH=/app
    depends_on:
      - chromadb

volumes:
  chroma_data:
